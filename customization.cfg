# linux-lunar customization
#
# Every option can be left empty ("") to be asked interactively by ./lunar.sh
# (only where a question makes sense), or to keep the default noted next to it.
# Personal overrides can live in ~/.config/linux-lunar.cfg, which is read after
# this file and wins over it, so `git pull` never conflicts with your choices.

#### KERNEL ###################################################################

# Kernel to build:
#   "stable"   newest stable release (looked up on kernel.org)
#   "mainline" newest mainline release, usually a release candidate
#   "7.3"      latest stable 7.3.x (looked up on kernel.org)
#   "7.3.1"    exactly that release
#   "7.4-rc1"  a mainline release candidate
#   ""         ask, offering the newest stable and mainline release (and any
#              other current release with a patch set); Enter picks the newest
#              stable release
_version=""

# linux-lunar uses the newest patch set in lunar-patches/ that is not newer
# than the kernel. When a kernel is newer than every patch set (7.5 is out,
# lunar-patches/ ends at 7.4), "true" tries the newest older set as it is:
# if every patch applies exactly the build continues as usual, if one does
# not the build stops with an error and nothing is built or installed.
# "false": only build kernels that have their own patch set.
_patch_fallback="true"

# Package name becomes linux-<suffix> (and linux-<suffix>-headers).
_pkgsuffix="lunar"

# Extra string appended to the kernel release (uname -r), e.g. "-test". Optional.
_localversion=""

# Verify stable tarballs with the kernel.org PGP signatures (Linus Torvalds /
# Greg Kroah-Hartman). Import the keys once:
#   gpg --locate-keys torvalds@kernel.org gregkh@kernel.org
# Release candidates are not signed and are never verified.
_pgp_verify="true"

#### BASE CONFIG ##############################################################

# Starting point for .config:
#   "arch"     Arch Linux's config for its linux package (downloaded)
#   "cachyos"  CachyOS's config for linux-cachyos (downloaded; CachyOS-only
#              options it contains are dropped automatically)
#   "running"  the config of the kernel you are running now (/proc/config.gz)
#   "/path"    any config file
_base_config="arch"

# Trim the config to the modules you actually use (make localmodconfig).
# Uses modprobed-db's database when it exists, otherwise the currently loaded
# modules. Much faster builds; anything never loaded before will be missing.
_localmodconfig="false"
_modprobeddb_path="$HOME/.config/modprobed.db"

# Open a config editor after all options below are applied:
#   "none" | "menuconfig" | "nconfig" | "xconfig"
_menuconfig="none"

#### COMPILER #################################################################

# "gcc" or "llvm" (clang + lld)
_compiler="llvm"

# Clang LTO, only with _compiler="llvm": "none" | "thin" | "full"
# thin: parallel, moderate memory, nearly all of the gain. full: single-threaded
# final link, lots of RAM, rarely measurably faster.
_lto_mode="thin"

# CPU to optimise for:
#   "native"   the CPU of this machine (-march=native, CONFIG_X86_NATIVE_CPU)
#   "generic"  plain x86-64 (runs anywhere)
#   anything else is passed as -march=..., e.g. "x86-64-v3", "znver3", "znver4",
#   "alderlake". The kernel then only runs on CPUs that support it.
_march="native"

# Extra compiler flags for the kernel (KCFLAGS). Optional, for experts.
_kcflags=""

# Parallel jobs for make. Empty = all CPU threads.
_jobs=""

#### SCHEDULING / TIMER #######################################################

# Timer frequency in Hz: "100" | "250" | "300" | "1000"
_timer_freq="1000"

# Preemption model: "lazy" | "full" | "rt"
# lazy: default on x86, good throughput and latency. full: lowest latency for
# normal tasks. rt: PREEMPT_RT real-time kernel (also enables EXPERT).
_preempt="full"

# Allow switching full/lazy at boot with preempt=... (PREEMPT_DYNAMIC)
_preempt_dynamic="true"

# Tick mode: "periodic" | "idle" | "full"
# periodic: timer tick always on (steady latency, a bit more power use when idle)
# idle: tick stops on idle CPUs (default in most distros). full: also on busy
# CPUs that run a single task (needs nohz_full= on the command line to matter).
_tickless="periodic"

# Maximum number of CPUs. Empty = keep the base config's value.
_nr_cpus="16"

# CPU frequency governor the kernel boots with:
#   "performance"   highest clocks, lowest latency, more power use
#   "schedutil"     follows the scheduler's load estimate (distro default)
#   "powersave"     lowest clocks (with amd-pstate/intel_pstate in active EPP
#                   mode: the balanced, power-aware setting)
# In active (EPP) mode, the amd-pstate default on Zen 2 and newer, the CPU
# itself picks clocks: "performance" sets the energy preference to
# performance, "schedutil" starts like "powersave". Changeable at runtime
# (cpupower, power-profiles-daemon) and at boot with cpufreq.default_governor=.
_cpu_governor="performance"

#### MEMORY ###################################################################

# Transparent hugepages, compiled-in default:
#   enabled: "always" | "madvise" | "never"
_thp_enabled="always"
#   defrag:  "always" | "defer" | "defer+madvise" | "madvise" | "never"
_thp_defrag="defer"
#   shmem_enabled (shared anonymous memory, memfd, SysV shm; not tmpfs
#   mounts such as /tmp or /dev/shm):
#   "always" | "within_size" | "advise" | "never" | empty = keep base config
_thp_shmem_enabled="always"
#   khugepaged defrag: "true" lets khugepaged reclaim and compact memory
#   itself when no free 2 MiB block is there to merge small pages into
#   (kernel default); "false" skips that merge and tries again later
_thp_khugepaged_defrag="false"
#   khugepaged pause after a failed huge page allocation, in ms
#   (1000..3600000; empty = kernel default 60000)
_thp_khugepaged_alloc_sleep_ms="2500"
#   khugepaged pages scanned per pass (1..4194304; empty = kernel default 4096)
_thp_khugepaged_pages_to_scan="8192"
#   khugepaged pause between scan passes, in ms
#   (100..3600000; empty = kernel default 10000)
_thp_khugepaged_scan_sleep_ms="2500"
#   swapped-out pages khugepaged may read back in to merge a 2 MiB range
#   (0..511; 0 = never swap in for a merge; empty = kernel default 64)
_thp_khugepaged_max_ptes_swap="0"

# Multi-gen LRU (MGLRU) built in and enabled by default
_mglru="true"
#   lru_gen/min_ttl_ms: when the working set of the last N ms can't be kept
#   in memory, kswapd calls the OOM killer. 0 = off (also the upstream
#   default, set here explicitly). 1000 killed a memstress run during a burst
#   with 13 GiB of zram still free, so leave it off unless you have tested a
#   value (0..600000; empty = don't touch the kernel source)
_mglru_min_ttl_ms="0"

#### LUNAR PATCHES ############################################################
# The patches from lunar-patches/<version>/. "true" applies, "false" skips.

# 0001 page-cache folios > 4 KiB without direct reclaim/compaction
_patch_filemap_large_folios="true"
# 0002 watermark boost no longer raises the min watermark or the direct
#      reclaim throttle line
_patch_boost_min_wmark="true"
# 0003 ttm.low_latency_alloc parameter (amdgpu & other TTM drivers)
_patch_ttm_low_latency="true"
# 0004 vm.defrag_soft: with defrag_mode=1, fall back instead of stalling
_patch_soft_defrag_mode="true"
# 0005 kswapd revived by kswapd's own and global direct reclaim progress
_patch_kswapd_hopeless="true"
# 0006 vm.lru_drain_timeout_ms: khugepaged, fadvise, KSM, drop_caches & co.
#      stop waiting for a CPU that can't run its drain work (IRQ storm, ...)
_patch_lru_drain_bounded="true"
# 0007 khugepaged runs at nice 0 instead of 19, so it no longer holds a
#      program's locks (mmap_lock, ...) at the lowest priority
_patch_khugepaged_prio="true"
# 0008 direct reclaim no longer compresses a whole 2 MiB huge page into zram
#      (3-4 ms with zstd) when the allocating task needs ~32 pages
_patch_direct_reclaim_split="true"

#### COMPILED-IN DEFAULTS #####################################################
# Values the kernel boots with. Empty = keep the upstream default.
# All of them can still be changed at runtime with sysctl / sysfs.

_default_defrag_mode="1"                  # vm.defrag_mode (0 or 1)
_default_defrag_soft="true"               # vm.defrag_soft (needs patch 0004 and defrag_mode=1)
_default_watermark_scale_factor="500"     # vm.watermark_scale_factor (1..3000)
_default_watermark_boost_factor="600"     # vm.watermark_boost_factor
_default_compaction_proactiveness="50"    # vm.compaction_proactiveness (0..100)
_default_swappiness="150"                 # vm.swappiness (0..200)
_default_ttm_low_latency="1"              # ttm.low_latency_alloc (1 or 2 need patch 0003)
#   reclaim effort for 2 MiB GPU pages: 0 = upstream (retry hard),
#   1 = one bounded reclaim/compaction round, 2 = never reclaim/compact in
#   the calling thread, only wake kswapd (fewest stalls, but fewer 2 MiB
#   pages on a fragmented system)
_default_lru_drain_timeout_ms="20"        # vm.lru_drain_timeout_ms (needs patch 0006, 0..1000)
_default_thp_direct_reclaim_split="true"  # vm.thp_direct_reclaim_split (needs patch 0008)

# Dirty page cache: how much written data may wait in RAM before writers are
# throttled, and when background writeback starts. Fixed sizes instead of a
# percentage of RAM keep the flush that a writer can end up waiting for short.
_default_dirty_bytes="536870912"          # vm.dirty_bytes (8192.., 512 MiB; replaces dirty_ratio)
_default_dirty_background_bytes="67108864" # vm.dirty_background_bytes (64 MiB; replaces dirty_background_ratio)
_default_dirty_writeback_centisecs="100"  # vm.dirty_writeback_centisecs (0..100000)
_default_dirty_expire_centisecs="500"     # vm.dirty_expire_centisecs (0..100000): data older
#                                           than this is written out (crash loses at most ~5 s)

_default_max_map_count="2147483642"       # vm.max_map_count (65530..2147483647)

# x86 split lock detection (Intel since Ice Lake/Tremont, AMD bus lock
# detection on newer CPUs): "warn" (kernel default) slows a program down on
# purpose every time it does a split lock, which some games do constantly.
_default_split_lock_detect="off"          # split_lock_detect= default: off, warn or fatal
_default_split_lock_mitigate="0"          # kernel.split_lock_mitigate (0 or 1, for "warn")

#### USER PATCHES #############################################################

# Also apply your own patches from linux<XY>-lunar-userpatches/ next to this
# file (e.g. linux73-lunar-userpatches/): *.myrevert are reverse-applied first,
# then *.mypatch, in alphabetical order. A failing patch stops the build.
_user_patches="true"

# Ask before applying them ("true") or apply silently ("false").
_user_patches_confirm="true"

#### PACKAGING ################################################################

# Also build linux-<suffix>-headers (needed for DKMS modules such as NVIDIA)
_build_headers="true"

# Never ask anything; fail if an option is missing instead.
_noninteractive="false"

#### CLEANUP ##################################################################

# When the build is interrupted (Ctrl+C, terminal closed, kill) or fails:
# stop all build processes and delete src/, pkg/ and partial downloads.
# Set to "false" to keep src/ for debugging a failed build.
_cleanup_on_abort="true"

# After a successful build: delete src/ and pkg/ (several GB). The packages
# (*.pkg.tar.zst) are always kept.
_cleanup_after_build="true"

# The kernel tarball and its signature are downloaded to sources/. After a
# successful build, keep the ones of the version just built, so rebuilding it
# skips the download (~140 MiB); tarballs of other versions are removed.
# "false": delete sources/ after every build.
_keep_kernel_source="true"
